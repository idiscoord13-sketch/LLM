seed: 42
output_dir: out/smoke/tinygpt
tokenizer: {vocab_size: 512, min_frequency: 1}
data:
  holdout: 0.1
  sources:
    - {name: fa,   path: data/samples/pretrain.jsonl, domain: fa,   weight: 0.5}
    - {name: en,   path: data/samples/pretrain.jsonl, domain: en,   weight: 0.3}
    - {name: code, path: data/samples/pretrain.jsonl, domain: code, weight: 0.2}
model: {n_layer: 2, n_head: 4, n_kv_head: 2, d_model: 64, max_seq_len: 64}
train: {max_steps: 30, batch_size: 8, grad_accum: 1, learning_rate: 3.0e-3, min_lr: 3.0e-4, warmup_steps: 5, schedule: wsd, eval_every: 10}
mixing: {adaptive: true, fertility_aware: true, eta: 2.0, min_prob: 0.1}
sft: {data: data/samples/sft_fa.jsonl, steps: 10, batch_size: 4, learning_rate: 1.0e-3}
